name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (do-personal)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Keep this script trivial — drone-ssh mangles line continuations and
          # its shell semantics are unreliable. All real logic lives in
          # Web/deploy.sh, which the checkout below brings up to date first.
          script: |
            set -e
            cd /var/www/markd
            echo "==> Was on: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            bash Web/deploy.sh
