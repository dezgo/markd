# Defence in depth in front of the app's own signup gate: this sheds a flood at
# the edge, before it ever costs a worker or a DB query. Valid here because
# sites-enabled/* is included inside the http block.
limit_req_zone $binary_remote_addr zone=markd_auth:10m rate=10r/m;

server {
    listen 80;
    server_name markd.appfoundry.cc;

    location /static/ {
        alias /var/www/markd/Web/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Auth endpoints only — the app's normal API must not be throttled.
    # burst=5 absorbs a legitimate retry; nodelay keeps real users feeling instant.
    location ~ ^/(signup|login|forgot-password|resend-verification)$ {
        limit_req  zone=markd_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://unix:/run/markd/markd.sock;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass         http://unix:/run/markd/markd.sock;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
